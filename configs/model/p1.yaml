_target_: src.models.p1_module.P1Module
arm: c                 # a flat, b flat+pen, c lvl, d lvl+pen (spec section 5)
lr: 1e-4
lam: 0.0               # (b), (d): 0.2 / mean r_t over steps 50-250 of the matching control (Amendment 1 S6)
ckpt_dir: ${paths.bioclip1_ckpt}
bank_seed_file: ${paths.p1_data_dir}/p1/bank_seed_s9.npy
drift_floor_file: ${paths.p1_data_dir}/p1/drift_floor.json
lora_r: 16
lora_alpha: 32.0
lora_towers: both      # both = spec lines 61, 154; image = image-side LoRA only (A15 probe, Amendment 3)
level_weighting: uniform   # line 96's mean over the seven levels (BFL Eq. 3); lse | ratio | gradnorm are A15 second-phase probes (Amendment 3)
lse_tau: 1.0           # lse: temperature in nats of the loss above its floor (TaxaWalk uses 0.1 on squared distances of unit vectors)
ratio_ref_steps: 50    # ratio: each level's reference is its mean loss above the floor over the first 50 steps
level_schedule: none   # M3 two-stage schedule (Amendment 4 draft): none = line 96; switch = seven levels for the first coarse_epochs epochs, then species only (arm a's objective); decay = coarse weights fall linearly to 0 over coarse_epochs epochs
coarse_epochs: 1       # epochs with coarse supervision under level_schedule=switch|decay (0-based epochs 0..coarse_epochs-1)
train_text_form: photo # line 51(a): "a photo of <lineage>." for every training label; lineage = the bare lineage (M3 recipe knob); evaluation always scores both
seed: ${seed}
epochs: 10             # line 161: the schedule always counts 10 epochs; the sweep stops at trainer.max_epochs=3
warmup_frac: 0.01
betas: [0.9, 0.98]
eps: 1.0e-6
weight_decay: 0.0
grad_clip: 1.0
penalty_weighting: inv_groups   # Amendment 1 S22; "uniform" is line 107's form and needs its own lambda
monitor_window: [50, 250]
monitor_every: 50
refresh: true
eval_init: true
eval_each_epoch: true
eval_forms: [photo, lineage]
check_zero_sum: true
