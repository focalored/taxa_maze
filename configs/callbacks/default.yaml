defaults:
  - model_checkpoint
  - model_summary
  - tqdm_progress_bar
  - lr_monitor
  - smooth_metrics
  - _self_

# Keeps the best epoch by zero-shot species top-1 on deduplicated ToL-10M val ("a photo of"
# template; spec section 7 selects the iNat21 checkpoint this way), plus last.ckpt for resuming.
model_checkpoint:
  dirpath: ${paths.output_dir}/checkpoints
  filename: "epoch_{epoch:03d}"
  monitor: "val/tol/photo/species"
  mode: "max"
  save_top_k: -1
  save_last: True
  auto_insert_metric_name: False

model_summary:
  max_depth: -1
