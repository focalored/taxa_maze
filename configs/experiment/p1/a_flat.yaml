# @package _global_
# Pilot 1 arm (a): flat. Usage: sbatch scripts/p1/train.sh experiment=p1/a_flat model.lr=1e-4
defaults:
  - override /model: p1
  - override /trainer: p1_ddp
  - override /callbacks: p1
  - override /logger: wandb

task_name: p1
seed: 42
version: 1
tags: ["p1", "a", "flat"]
model:
  arm: a
  lam: 0.0
run_name: p1a_flat_lr${sci:${model.lr}}_s${seed}_v${version}

hydra:
  run:
    dir: ${paths.log_dir}/p1/${run_name}/${now:%Y-%m-%d_%H-%M-%S}_j${oc.env:SLURM_JOB_ID,local}
